<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="/assets/favicon.ico" sizes="32x32">
  <link rel="icon" href="/assets/movieplus-favicon.svg" type="image/svg+xml">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>MoviePlus - Watch movies online for free!</title>
  <script>
    /*
      GitHub Pages serves this file for any path it does not have a file for,
      which is every client-side route once the app uses real URLs instead of
      hash fragments. We stash the requested path in the query string and bounce
      to the root document; index.html restores the real URL before React boots,
      so a direct visit or a refresh on /watch?id=123 lands on the right page.
    */
    (function (l) {
      l.replace(
        l.protocol + '//' + l.host + '/?/' +
        l.pathname.slice(1).replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    }(window.location));
  </script>
</head>

</html>
